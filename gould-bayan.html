<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Гленн Гульд — принципи для баяніста</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0f1218;
  --ink-soft: #2a3040;
  --ink-muted: #6a7485;
  --bg: #f0f2f5;
  --bg-warm: #e8eaee;
  --border: #c8cdd8;
  --accent: #1a3a5c;
  --accent-soft: #2e5f8a;
  --accent-pale: #dde8f2;
  --steel: #2c4a3e;
  --steel-pale: #ddeee8;
  --violet: #3d2a5c;
  --violet-pale: #ece6f4;
  --rust: #5c2a1a;
  --rust-pale: #f2e0d8;
  --gold: #5c4a10;
  --gold-pale: #f2ecd4;
  --slate: #2a3a4a;
  --slate-pale: #dde4ec;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Lato', sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  font-weight: 300;
}

.site-header {
  background: var(--ink);
  color: #e8eaee;
  padding: 2.5rem 2rem 2rem;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.site-header::before {
  content: '';
  position: absolute; inset: 0;
  background:
    repeating-linear-gradient(90deg, transparent, transparent 60px, rgba(255,255,255,0.012) 60px, rgba(255,255,255,0.012) 61px),
    repeating-linear-gradient(0deg, transparent, transparent 60px, rgba(255,255,255,0.012) 60px, rgba(255,255,255,0.012) 61px);
}
.header-sup {
  font-size: 11px; font-weight: 700;
  letter-spacing: 0.25em; text-transform: uppercase;
  color: #7aaad4; margin-bottom: 0.75rem;
}
.header-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(2rem, 5vw, 3.2rem);
  font-weight: 400; line-height: 1.15; color: #e8eaee;
  margin-bottom: 0.5rem;
}
.header-title em { font-style: italic; color: #7aaad4; }
.header-sub { font-size: 13px; color: #7a8a9a; font-weight: 300; letter-spacing: 0.04em; }
.header-divider { width: 60px; height: 1px; background: #7aaad4; margin: 1.25rem auto 0; opacity: 0.5; }

.stats-bar {
  display: flex; justify-content: center;
  background: var(--ink-soft);
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.stat-item {
  padding: 0.85rem 2rem; text-align: center;
  border-right: 1px solid rgba(255,255,255,0.06);
  flex: 1; max-width: 150px;
}
.stat-item:last-child { border-right: none; }
.stat-n { font-family: 'Cormorant Garamond', serif; font-size: 1.6rem; font-weight: 500; color: #7aaad4; }
.stat-l { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #7a8a9a; margin-top: 1px; }

.controls { max-width: 880px; margin: 2rem auto 0; padding: 0 1.5rem; }

.search-wrap { position: relative; margin-bottom: 1rem; }
.search-wrap input {
  width: 100%; padding: 10px 16px 10px 40px;
  border: 1px solid var(--border); border-radius: 4px;
  background: #fff; font-family: 'Lato', sans-serif; font-size: 14px; font-weight: 300;
  color: var(--ink); outline: none; transition: border-color 0.2s;
}
.search-wrap input:focus { border-color: var(--accent-soft); }
.search-wrap input::placeholder { color: var(--ink-muted); }
.search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--ink-muted); font-size: 15px; pointer-events: none; }

.filter-row { display: flex; gap: 8px; flex-wrap: wrap; }
.fbtn {
  padding: 5px 14px; font-size: 12px; font-weight: 400; letter-spacing: 0.03em;
  border-radius: 99px; cursor: pointer; border: 1px solid var(--border);
  background: #fff; color: var(--ink-soft); transition: all 0.15s; white-space: nowrap;
}
.fbtn:hover { border-color: var(--accent-soft); color: var(--accent); }
.fbtn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.fbtn .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }

.main { max-width: 880px; margin: 1.5rem auto 3rem; padding: 0 1.5rem; }
.cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }

.card {
  background: #fff; border: 1px solid var(--border); border-radius: 6px;
  overflow: hidden; cursor: pointer; transition: box-shadow 0.2s, transform 0.15s;
  border-top: 3px solid transparent;
}
.card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.09); transform: translateY(-1px); }
.card.open { box-shadow: 0 4px 20px rgba(0,0,0,0.12); }

.card-top { padding: 1rem 1.1rem 0.9rem; }
.card-row { display: flex; align-items: flex-start; gap: 10px; }
.card-num { font-family: 'Cormorant Garamond', serif; font-size: 1.4rem; font-weight: 400; line-height: 1; opacity: 0.2; flex-shrink: 0; margin-top: 2px; }
.card-meta { flex: 1; }
.card-title { font-family: 'Cormorant Garamond', serif; font-size: 1.05rem; font-weight: 500; line-height: 1.35; color: var(--ink); }
.card-badge { display: inline-block; margin-top: 5px; font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; padding: 2px 8px; border-radius: 3px; }
.chevron { font-size: 11px; color: var(--ink-muted); transition: transform 0.2s; flex-shrink: 0; margin-top: 4px; }
.card.open .chevron { transform: rotate(180deg); }

.card-body { max-height: 0; overflow: hidden; transition: max-height 0.35s ease; padding: 0 1.1rem; }
.card-body.open { max-height: 700px; padding-bottom: 1.1rem; }
.body-inner { padding-top: 0.9rem; border-top: 1px solid var(--border); }

.section-label { font-size: 10px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 6px; }
.quote-block { font-family: 'Cormorant Garamond', serif; font-size: 1rem; font-style: italic; line-height: 1.65; color: var(--ink-soft); padding-left: 12px; border-left: 2px solid var(--border); margin-bottom: 12px; }
.bayan-block { font-size: 13px; line-height: 1.7; color: var(--ink); font-weight: 300; }

.cat-tempo .card { border-top-color: #1a3a5c; }
.cat-tempo .card-badge { background: var(--accent-pale); color: var(--accent); }
.cat-tempo .section-label { color: var(--accent); }

.cat-voice .card { border-top-color: #2c4a3e; }
.cat-voice .card-badge { background: var(--steel-pale); color: var(--steel); }
.cat-voice .section-label { color: var(--steel); }

.cat-mind .card { border-top-color: #3d2a5c; }
.cat-mind .card-badge { background: var(--violet-pale); color: var(--violet); }
.cat-mind .section-label { color: var(--violet); }

.cat-touch .card { border-top-color: #5c2a1a; }
.cat-touch .card-badge { background: var(--rust-pale); color: var(--rust); }
.cat-touch .section-label { color: var(--rust); }

.cat-structure .card { border-top-color: #5c4a10; }
.cat-structure .card-badge { background: var(--gold-pale); color: var(--gold); }
.cat-structure .section-label { color: var(--gold); }

.cat-practice .card { border-top-color: #2a3a4a; }
.cat-practice .card-badge { background: var(--slate-pale); color: var(--slate); }
.cat-practice .section-label { color: var(--slate); }

.empty { text-align: center; padding: 4rem 1rem; color: var(--ink-muted); font-family: 'Cormorant Garamond', serif; font-size: 1.2rem; }

footer { text-align: center; padding: 1.5rem 1rem; font-size: 11px; color: var(--ink-muted); letter-spacing: 0.05em; border-top: 1px solid var(--border); margin-top: 1rem; }

@media (max-width: 600px) {
  .site-header { padding: 1.75rem 1rem 1.5rem; }
  .stat-item { padding: 0.7rem 1rem; }
  .controls, .main { padding: 0 1rem; }
  .cards-grid { grid-template-columns: 1fr; }
}

@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.card { animation: fadeIn 0.3s ease both; }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-sup">Мистецтво виконавства</div>
  <h1 class="header-title">Гленн <em>Гульд</em><br>— принципи для баяніста</h1>
  <p class="header-sub">Геніальний канадський піаніст — радикальна філософія виконавства, адаптована для баяну</p>
  <div class="header-divider"></div>
</header>

<div class="stats-bar">
  <div class="stat-item"><div class="stat-n" id="shown-n">18</div><div class="stat-l">показано</div></div>
  <div class="stat-item"><div class="stat-n">18</div><div class="stat-l">принципів</div></div>
  <div class="stat-item"><div class="stat-n">6</div><div class="stat-l">категорій</div></div>
</div>

<div class="controls">
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input type="text" id="search" placeholder="Пошук принципів...">
  </div>
  <div class="filter-row" id="filters">
    <button class="fbtn active" data-cat="all">Всі</button>
    <button class="fbtn" data-cat="tempo"><span class="dot" style="background:#1a3a5c"></span>Темп і ритм</button>
    <button class="fbtn" data-cat="voice"><span class="dot" style="background:#2c4a3e"></span>Голоси і поліфонія</button>
    <button class="fbtn" data-cat="mind"><span class="dot" style="background:#3d2a5c"></span>Інтелект і концепція</button>
    <button class="fbtn" data-cat="touch"><span class="dot" style="background:#5c2a1a"></span>Туше і дотик</button>
    <button class="fbtn" data-cat="structure"><span class="dot" style="background:#5c4a10"></span>Форма і структура</button>
    <button class="fbtn" data-cat="practice"><span class="dot" style="background:#2a3a4a"></span>Праця над п'єсою</button>
  </div>
</div>

<main class="main">
  <div class="cards-grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none;">Нічого не знайдено</div>
</main>

<footer>Принципи Гленна Гульда — адаптація для баяну · Ігор Савков</footer>

<script>
const CAT_LABELS = {
  tempo: "Темп і ритм",
  voice: "Голоси і поліфонія",
  mind: "Інтелект і концепція",
  touch: "Туше і дотик",
  structure: "Форма і структура",
  practice: "Праця над п'єсою"
};

const data = [
  {
    cat: "tempo",
    title: "Темп як архітектурне рішення, а не традиція",
    quote: "I don't think tempo is something you choose from habit or convention. It must emerge from the architecture of the piece — from its harmonic rhythm, its phrase length, its inner pulse.",
    bayan: "На баяні темп визначає характер руху міха. Повільний Гульдівський темп у Баху — не «повільно заради повільного», а час, за який кожен голос встигає «дихати» окремо. Обери темп так, щоб поліфонія була чутною, а не злитою."
  },
  {
    cat: "tempo",
    title: "Нерівномірність ритму — засіб виразності",
    quote: "I never play two phrases exactly alike in tempo. Slight fluctuations — not rubato in the Romantic sense, but structural elasticity — give the music its sense of inevitability.",
    bayan: "Мікроагогіка на баяні: незначні зміни швидкості руху міха всередині фрази. Це не романтичне rubato — це структурна пружність. На стику фраз — мить уповільнення, на вершині — мить прискорення."
  },
  {
    cat: "tempo",
    title: "Пульс — внутрішній, а не метрономний",
    quote: "The metronome is a tyranny. Music breathes. The beat must live inside you — not as a click, but as a heartbeat that can speed up, slow down, pause.",
    bayan: "Баяніст відчуває пульс через рух міха — це унікальна перевага. Міх «дихає» разом з музикою. Не «відраховуй» долі — відчувай їх як фізичний рух тіла. Гульд співав — ти рухаєш міх."
  },
  {
    cat: "voice",
    title: "Кожен голос — окрема особистість",
    quote: "In a Bach fugue, the voices are characters in a drama. They argue, they agree, they ignore each other. I give each one a distinct personality — different touch, different weight, different intention.",
    bayan: "На баяні можливо більше, ніж на фортепіано: різні регістри для різних голосів, різне туше, різна артикуляція. Тема — кларнет 8' з глибоким туше. Відповідь — флейта 4' легко. Контрапункт — нон легато, тихіше."
  },
  {
    cat: "voice",
    title: "Нижній голос так само важливий, як верхній",
    quote: "We always listen to the soprano. But in Bach, the bass is the foundation of the argument. I practice left hand alone until it speaks as clearly as the right.",
    bayan: "Ліва рука баяніста — не просто акомпанемент. У Баху це рівноправний голос. Практикуй басовий голос окремо, з власною артикуляцією, динамікою, фразуванням. Фагот 16' надає йому глибину і характер."
  },
  {
    cat: "voice",
    title: "Контрапункт — розмова, а не фон",
    quote: "Counterpoint is not decoration. It is argument. When the second voice enters, it does not accompany the first — it responds, contradicts, completes.",
    bayan: "Кожен новий голос у поліфонії — не фон, а репліка в діалозі. На баяні: коли входить другий голос — злегка підкресли його вхід динамікою міха. Потім відступи на другий план, але не зникай."
  },
  {
    cat: "mind",
    title: "Виконавець — співавтор, а не слуга",
    quote: "I am not a servant of the composer. I am a collaborator across time. Bach wrote the notes; I decide what they mean today.",
    bayan: "Не бійся власної інтерпретації. Гульд грав Баха інакше, ніж усі — і це було геніально. Баяніст виконує Баха на інструменті, якого Бах не знав. Це вже інтерпретація. Роби її свідомо."
  },
  {
    cat: "mind",
    title: "Знай партитуру без інструмента",
    quote: "I can hear a score in my head so completely that I sometimes forget I need to sit down and actually play it. The performance begins long before you touch the instrument.",
    bayan: "Вивчай партитуру від рояля: читай її у ліжку, в транспорті, за столом. Чуй кожен голос внутрішньо. Коли сядеш з баяном — міх лише реалізує те, що вже звучить у тебе всередині."
  },
  {
    cat: "mind",
    title: "Концепція важливіша за традицію",
    quote: "I don't care how it has always been done. I care about why. If I cannot justify a tempo, a dynamic, an articulation with a musical reason — I change it.",
    bayan: "Питай себе про кожне рішення: чому цей регістр? чому це темпо? чому legato тут? Якщо відповідь «так прийнято» — це не відповідь. Гульдівська вимога: кожне рішення має бути інтелектуально обґрунтованим."
  },
  {
    cat: "touch",
    title: "Низька позиція руки — контроль, а не традиція",
    quote: "I play with a very low wrist and flat fingers not because of any school, but because it gives me maximum control over the speed and depth of the key descent.",
    bayan: "На баяні аналог — глибина і швидкість натискання кнопки. Повільне, глибоке занурення = м'який початок звуку. Швидке = чітке атаку. Тренуй цей контроль окремо: одна нота, різні способи натискання."
  },
  {
    cat: "touch",
    title: "Legato як виняток, non legato як основа",
    quote: "I think legato is overused. The piano — and Bach — breathes between notes. Too much legato smears the counterpoint into mud.",
    bayan: "Гульд і Шифф тут єдині: non legato — основа Баха на баяні. Але Гульд іде далі: навіть у кантиленних місцях він зберігає «повітря» між нотами. На баяні це означає мікропаузи через злегка ослаблений тиск міха."
  },
  {
    cat: "touch",
    title: "Тиша між нотами — не пауза, а зміст",
    quote: "The silence between notes is not empty. It is charged. I shape it as carefully as the notes themselves.",
    bayan: "Момент між звуками на баяні — мить без тиску міха. Але цей «нуль» має форму: він може бути різкий (стаккато), плавний (portato), або напружений (підготовка до наступної ноти). Тренуй типи тиші окремо."
  },
  {
    cat: "structure",
    title: "Форма — не контейнер, а зміст",
    quote: "The fugue is not a form that Bach fills with notes. The form IS the argument. Every entry, every stretto, every episode is a logical step in a philosophical debate.",
    bayan: "Перед виконанням фуги — намалюй її «діаграму»: де теми, де відповіді, де стретто, де кульмінація. На баяні кожен розділ має отримати свій тембровий і динамічний план. Форма = карта твого виконання."
  },
  {
    cat: "structure",
    title: "Горизонталь важливіша за вертикаль",
    quote: "Most pianists think vertically — they hear chords. I think horizontally — I hear lines. In Bach, the lines are everything.",
    bayan: "Думай лініями, а не акордами. На баяні це природно для виборної клавіатури. Але й на готовій системі: веди кожен голос окремо, не «виправляй» вертикаль на шкоду горизонтальній логіці."
  },
  {
    cat: "structure",
    title: "Кульмінація — результат логіки, а не емоції",
    quote: "I never decide in advance to make a climax 'emotional.' The climax must arrive because the structure demands it. If you build correctly, the emotion takes care of itself.",
    bayan: "Не «натискай» на кульмінацію заздалегідь запланованим forte. Нехай вона виростає з поліфонічного нагромадження голосів. На баяні: кульмінація — це момент максимального тиску міха + повний хід клавіші всіх голосів одночасно."
  },
  {
    cat: "practice",
    title: "Мисленнєве програвання — повноцінна праця",
    quote: "Some of my best practice happens away from the piano. I sit in silence, score in hand, and play it in my mind — every detail, every color, every decision.",
    bayan: "Гульд практикував ментально більше, ніж фізично. Для баяніста: уяви рух міха, відчуй пальці на кнопках — без інструмента. Це особливо корисно для складних поліфонічних місць, де пальці «заважають думати»."
  },
  {
    cat: "practice",
    title: "Запис — дзеркало правди",
    quote: "I learned more about my playing from recordings than from any teacher. You cannot lie to a microphone. Every unclear note, every unintended accent — it's all there.",
    bayan: "Записуй свої репетиції на телефон. Слухай критично: чи чутна поліфонія? чи є «брудні» переходи міха? чи рівна артикуляція? Гульд вважав запис кращим педагогом, ніж живий концерт."
  },
  {
    cat: "practice",
    title: "Повільне вивчення — з повним інтелектуальним контролем",
    quote: "When I learn a new piece slowly, I am not just learning the notes. I am making decisions. Every slow run-through is a series of choices — and they must all be conscious.",
    bayan: "Повільне темпо на баяні — не «розігрів», а інтелектуальна робота. Кожна нота: який туше? який напрямок міха? яка артикуляція? Гульд забороняв собі «механічне» повторення — тільки свідома праця."
  }
];

let currentCat = "all", currentSearch = "", openIdx = null;

function render() {
  const grid = document.getElementById("grid");
  const empty = document.getElementById("empty");
  const q = currentSearch.toLowerCase();
  const filtered = data.map((p,i) => ({...p,origIdx:i})).filter(p => {
    const catOk = currentCat === "all" || p.cat === currentCat;
    const textOk = !q || p.title.toLowerCase().includes(q) || p.bayan.toLowerCase().includes(q);
    return catOk && textOk;
  });
  document.getElementById("shown-n").textContent = filtered.length;
  if (!filtered.length) { grid.innerHTML=""; empty.style.display="block"; return; }
  empty.style.display = "none";
  grid.innerHTML = filtered.map((p,i) => {
    const isOpen = openIdx === p.origIdx;
    return `<div class="card cat-${p.cat}${isOpen?" open":""}" onclick="toggle(${p.origIdx})" style="animation-delay:${i*0.04}s">
      <div class="card-top">
        <div class="card-row">
          <div class="card-num">${String(p.origIdx+1).padStart(2,"0")}</div>
          <div class="card-meta">
            <div class="card-title">${p.title}</div>
            <span class="card-badge">${CAT_LABELS[p.cat]}</span>
          </div>
          <div class="chevron">${isOpen?"▲":"▼"}</div>
        </div>
      </div>
      <div class="card-body${isOpen?" open":""}">
        <div class="body-inner">
          <div class="section-label">Гульд — оригінал:</div>
          <div class="quote-block">${p.quote}</div>
          <div class="section-label">Адаптація для баяну:</div>
          <div class="bayan-block">${p.bayan}</div>
        </div>
      </div>
    </div>`;
  }).join("");
}

function toggle(idx) { openIdx = openIdx===idx ? null : idx; render(); }

document.getElementById("filters").addEventListener("click", e => {
  const btn = e.target.closest(".fbtn");
  if (!btn) return;
  currentCat = btn.dataset.cat; openIdx = null;
  document.querySelectorAll(".fbtn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active"); render();
});

document.getElementById("search").addEventListener("input", e => {
  currentSearch = e.target.value; openIdx = null; render();
});

render();
</script>
</body>
</html>
